# Tokyo Night Day (light)
set -g status-style "fg=#3760bf,bg=default"
set -g status-left "#[fg=#587539,bold] #S #[fg=#6172b0,nobold] | "
set -g status-right " #{cpu}   #{mem} "
set -g window-status-current-format "#[fg=#007197,bold]  #[underscore]#I:#W"
set -g window-status-format "#[fg=#8990b3] #I:#W"
set -g message-style "fg=#3760bf,bg=#e9e9ed"
set -g mode-style "fg=#e1e2e7,bg=#2e7de9"
set -g pane-border-style "fg=#b4b5b9"
set -g pane-active-border-style "fg=#587539"
