# Tokyo Night (dark)
set -g status-style "fg=#a9b1d6,bg=default"
set -g status-left "#[fg=#9ece6a,bold] #S #[fg=#a9b1d6,nobold] | "
set -g status-right " #{cpu}   #{mem} "
set -g window-status-current-format "#[fg=#7dcfff,bold]  #[underscore]#I:#W"
set -g window-status-format "#[fg=#565f89] #I:#W"
set -g message-style "fg=#a9b1d6,bg=#1f2335"
set -g mode-style "fg=#1a1b26,bg=#7aa2f7"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#9ece6a"
